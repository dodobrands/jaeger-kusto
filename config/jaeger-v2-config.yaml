# Jaeger V2 query-only configuration with Kusto trace backend and RED metrics
#
# This configuration uses:
#   - gRPC remote storage for traces → jaeger-kusto plugin (read-only)
#   - PromQL shim for metrics → kusto-promql-shim (built into jaeger-kusto)
#
# Traces must already exist in Kusto, typically via the OpenTelemetry Collector's
# Azure Data Explorer exporter. Jaeger runs here in query/UI mode only.

service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [nop]
      processors: [batch]
      exporters: [nop]
  telemetry:
    resource:
      service.name: jaeger-query
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
    logs:
      level: info

extensions:
  healthcheckv2:
    use_v2: true
    http:

  jaeger_query:
    storage:
      traces: kusto_traces
      metrics: kusto_metrics
    ui:
      config_file: /etc/jaeger/jaeger-ui.json

  jaeger_storage:
    backends:
      kusto_traces:
        grpc:
          endpoint: "jaeger-kusto:8989"
          tls:
            insecure: true
    metric_backends:
      kusto_metrics:
        prometheus:
          endpoint: "http://jaeger-kusto:9090"

receivers:
  nop:

processors:
  batch:

exporters:
  nop:
