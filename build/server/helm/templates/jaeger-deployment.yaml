apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.service.name: kusto-jaeger
  name: jaeger
spec:
  replicas: 2
  selector:
    matchLabels:
      io.service.name: kusto-jaeger
  template:
    metadata:
      annotations:
        service.version: 1.1.0-Preview
      labels:
        io.kompose.network/server-default: "true"
        io.service.name: kusto-jaeger
    spec:
      containers:
        - args:
            - --config=/etc/jaeger/config.yaml
          image: cr.jaegertracing.io/jaegertracing/jaeger:2.18.0
          name: jaeger
          ports:
            - containerPort: 16686
              hostPort: 16686
              protocol: TCP
            - containerPort: 16687
              hostPort: 16687
              protocol: TCP
            - containerPort: 13133
              hostPort: 13133
              protocol: TCP
          volumeMounts:
            - name: jaeger-config
              mountPath: /etc/jaeger/config.yaml
              subPath: config.yaml
            - name: jaeger-ui-config
              mountPath: /etc/jaeger/jaeger-ui.json
              subPath: jaeger-ui.json
      restartPolicy: Always
      volumes:
        - name: jaeger-config
          configMap:
            name: jaeger-config
            items:
              - key: config.yaml
                path: config.yaml
        - name: jaeger-ui-config
          configMap:
            name: jaeger-ui-config
            items:
              - key: jaeger-ui.json
                path: jaeger-ui.json
