apiVersion: v1
data:
  jaeger-kusto-config.json: |-
    {
        {{- if .Values.authConfig.clientId }}
        "clientId": {{ .Values.authConfig.clientId | quote}},
        {{- end }}
        {{- if .Values.authConfig.clientSecret }}
        "clientSecret": {{ .Values.authConfig.clientSecret | quote}},
        {{- end }}
        {{- if .Values.authConfig.traceTableName }}
        "traceTableName": {{ .Values.authConfig.traceTableName | quote}},
        {{- end }}
        "useWorkloadIdentity": {{default false .Values.authConfig.useWorkloadIdentity }},
        "useManagedIdentity": {{default false .Values.authConfig.useManagedIdentity}},
        "database": {{ .Values.authConfig.database  | quote}},
        {{- if or .Values.authConfig.tenantId .Values.authConfig.metricsViewName .Values.authConfig.serviceCatalogViewName }}
        "endpoint": {{ .Values.authConfig.clusterUrl | quote}},
        {{- else }}
        "endpoint": {{ .Values.authConfig.clusterUrl | quote}}
        {{- end }}
        {{- if .Values.authConfig.tenantId }}
        "tenantId": {{ .Values.authConfig.tenantId | quote}}{{- if or .Values.authConfig.metricsViewName .Values.authConfig.serviceCatalogViewName }},{{- end }}
        {{- end }}
        {{- if .Values.authConfig.metricsViewName }}
        "metricsViewName": {{ .Values.authConfig.metricsViewName | quote}}{{- if .Values.authConfig.serviceCatalogViewName }},{{- end }}
        {{- end }}
        {{- if .Values.authConfig.serviceCatalogViewName }}
        "serviceCatalogViewName": {{ .Values.authConfig.serviceCatalogViewName | quote}}
        {{- end }}
    }
kind: ConfigMap
metadata:
  annotations:
    use-subpath: "true"
  labels:
    io.service.name: kusto-jaeger-plugin
    app: {{ .Release.Name }}-app
  name: plugin-auth-config
  namespace: {{ .Release.Namespace }}
