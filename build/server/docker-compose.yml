services:
  jaeger-kusto:
    build:
      context: ../..
      dockerfile: build/server/Dockerfile
    restart: "no"
    command:
      - "--config=/config/jaeger-kusto-plugin-config.json"
    ports:
      - "6060:6060"
      - "8989:8989"
      - "9090:9090"
    volumes:
      - "../../jaeger-kusto-config.json:/config/jaeger-kusto-config.json"
      - "./jaeger-kusto-plugin-config.json:/config/jaeger-kusto-plugin-config.json"
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.18.0
    command:
      - "--config=/etc/jaeger/config.yaml"
    volumes:
      - "../../config/jaeger-v2-config.yaml:/etc/jaeger/config.yaml:ro"
      - "../../config/jaeger-ui.json:/etc/jaeger/jaeger-ui.json:ro"
    ports:
      - "16686:16686"
      - "13133:13133"
    depends_on:
      - jaeger-kusto
